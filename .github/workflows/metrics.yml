name: Metrics
on:
  # Schedule daily updates
  schedule: [{cron: "0 0 * * *"}]
  # Run on push to main
  push: {branches: ["main"]}
  # Allow manual trigger
  workflow_dispatch:

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          
          # Output file
          filename: github-metrics.svg
          
          # User settings
          user: llima
          template: classic
          base: header, activity, community, repositories, metadata
          
          # Include private contributions
          base_indepth: yes
          
          # Important: fetch more repositories and include all affiliations
          repositories: 200
          repositories_affiliations: owner, collaborator, organization_member
          repositories_forks: yes
          
          # Important: specify your commit emails for accurate stats
          commits_authoring: llima, luiz.lima@live.com, luiz.lima@elevenfinancial.com, luiz.dev@hubcred.com.br, luizsan.lima@gmail.com, arquiteto@suno.com.br, luiz.lima@nexgs.com.br, luiz.lima@fingate.com.br, luiz.rsantos@cxmail.com.br, llima@users.noreply.github.com
          
          # Config
          config_timezone: America/Sao_Paulo
          config_display: large
          
          # Lines of code
          plugin_lines: yes
          plugin_lines_history_limit: 1
          plugin_lines_sections: base
          
          # Isometric calendar
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          
          # Top Languages with indepth for private repos
          plugin_languages: yes
          plugin_languages_indepth: yes
          plugin_languages_analysis_timeout: 30
          plugin_languages_categories: markup, programming
          plugin_languages_colors: github
          plugin_languages_ignored: html, css, tex, less, dockerfile, makefile, qmake, lex, cmake, shell, gnuplot
          plugin_languages_limit: 8
          plugin_languages_details: bytes-size, percentage

name: Metrics

on:
  # Schedule daily updates
  schedule: [{cron: "0 0 * * *"}]
  # Run on push to main
  push: {branches: ["main"]}
  # Allow manual trigger
  workflow_dispatch:

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@v3.34
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: github-metrics.svg
          user: llima
          template: classic

          # Commit the render back to whichever branch triggered the run, so this
          # workflow can be exercised on a branch without writing to main.
          committer_branch: ${{ github.ref_name }}

          base: header, activity, community, repositories, metadata
          base_indepth: yes

          # DO NOT set repositories_affiliations to organization_member.
          #   The three orgs hold 393 repositories but only 86 were contributed to.
          #   Iterating all 393 times out the GraphQL API ("failed to retrieve 100
          #   repositories, halving batch") and silently zeroes every per-repo stat.
          #   Measured on 2026-08-15: lines 121k/66.1k -> 0/0, stargazers 12 -> 0,
          #   watchers 6 -> 0, languages -> 0.
          # The default (owner) keeps those correct. Private work still shows up in
          # the header/activity/follow-up totals, which come from the contributions
          # API rather than from repository iteration.

          # Every identity used to author commits, so attribution is not missed.
          commits_authoring: >-
            llima,
            llima@users.noreply.github.com,
            luiz.lima@live.com,
            luizsan.lima@gmail.com,
            luiz.lima@nexgs.com.br,
            luiz.lima@fingate.com.br,
            luiz.lima@elevenfinancial.com,
            luiz.dev@hubcred.com.br,
            arquiteto@suno.com.br,
            luiz.rsantos@cxmail.com.br

          config_timezone: America/Sao_Paulo
          config_display: large

          # Isometric contribution calendar
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

          # Lines of code.
          # The `repositories` section is deliberately omitted: it prints repository
          # names, which for this account are private client repositories.
          plugin_lines: yes
          plugin_lines_sections: base, history
          plugin_lines_history_limit: 5
          # The GitHub stats endpoint answers the first request from a cold cache and
          # returns nothing. Re-query after 10s so the totals are not silently zero.
          plugin_lines_delay: 10

          # Issue / pull request follow-up.
          # The `user` section covers everything authored across GitHub, private
          # repositories included, without iterating repositories. This is where the
          # private consultancy work becomes visible (758 merged PRs).
          plugin_followup: yes
          plugin_followup_sections: user
          plugin_followup_indepth: yes

          # ---------------------------------------------------------------------
          # Plugins deliberately NOT enabled, with the reason. Verified 2026-08-15
          # against lowlighter/metrics v3.34 — none of these are fixable here.
          #
          # plugin_habits, plugin_activity, plugin_code, and the "recently-used"
          #   section of plugin_languages all read `payload.commits` from the GitHub
          #   Events API. GitHub no longer populates it: 94 of 94 recent PushEvents
          #   return commits/size/distinct_size as null. habits crashes at
          #   habits/index.mjs:51, activity at activity/index.mjs:140.
          #
          # plugin_achievements queries Projects (classic) fields, which GitHub has
          #   sunset. The whole query now resolves to `data: {user: null}`.
          #
          # plugin_topics renders empty: it lists starred *topics*, and this account
          #   has starred repositories but no topics.
          # ---------------------------------------------------------------------
